<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
</head>
<body>

    <h1>To Do List</h1>

    <div class="controls">
        <button id="newBtn">New</button>
    </div>

    <div id="ft_list"></div>

    <script>
        
        function setCookie(name, value, days) {
            let d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            let expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1);
                if (c.indexOf(nameEQ) == 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return null;
        }

        const listContainer = document.getElementById('ft_list');

        function addTaskToDOM(text) {
            const div = document.createElement('div');
            div.className = 'todo-item';
            div.textContent = text;

            div.addEventListener('click', function() {
                const check = confirm("Do you want to remove this TO DO?");
                if (check) {
                    div.remove();
                    saveListToCookie();
                }
            });

            listContainer.prepend(div);
        }

        function saveListToCookie() {
            let tasks = [];
            for (let i = 0; i < listContainer.children.length; i++) {
                tasks.push(listContainer.children[i].textContent);
            }
            setCookie('ft_list', JSON.stringify(tasks), 365);
        }

        document.getElementById('newBtn').addEventListener('click', function() {
            const input = prompt("Enter a new task:");

            if (input && input.trim() !== "") {
                addTaskToDOM(input);
                saveListToCookie();
            }
        });
        
        window.onload = function() {
            const cookieData = getCookie('ft_list');
            
            if (cookieData) {
                const tasks = JSON.parse(cookieData);
                for (let i = tasks.length - 1; i >= 0; i--) {
                    addTaskToDOM(tasks[i]);
                }
            }
        };

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager (jQuery)</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <h1>To Do List</h1>
    <div class="controls">
        <button id="newBtn">New</button>
    </div>
    <div id="ft_list"></div>

    <script>
        function setCookie(name, value, days) {
            let d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/";
        }

        function getCookie(name) {
            let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return decodeURIComponent(match[2]);
            return null;
        }

        $(document).ready(function() {
            
            function addTask(text) {
                const $newItem = $('<div></div>').text(text).addClass('todo-item');
                $('#ft_list').prepend($newItem);
            }

            function saveList() {
                let tasks = [];
                $('#ft_list .todo-item').each(function() {
                    tasks.push($(this).text());
                });
                setCookie('ft_list', JSON.stringify(tasks), 365);
            }

            $('#newBtn').click(function() {
                const input = prompt("Enter a new task:");
                if (input && input.trim() !== "") {
                    addTask(input);
                    saveList();
                }
            });

            $('#ft_list').on('click', '.todo-item', function() {
                if (confirm("Do you want to remove this TO DO?")) {
                    $(this).remove();
                    saveList();
                }
            });

            const cookieData = getCookie('ft_list');
            if (cookieData) {
                const tasks = JSON.parse(cookieData);
                for (let i = tasks.length - 1; i >= 0; i--) {
                    addTask(tasks[i]);
                }
            }
        });
    </script>

</body>
</html>

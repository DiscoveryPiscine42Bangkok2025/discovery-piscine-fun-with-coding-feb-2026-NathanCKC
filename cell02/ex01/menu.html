<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>
    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

    </style>
</head>
<body>

    <h2>hi</h2>

    <div class="dropdown">
        <button class="dropbtn">Hamburger</button>
        <div class="dropdown-content">
            <a href="#">bread</a>
            <a href="#">tomato</a>
            <a href="#">cheese</a>
            <a href="#">beef</a>
            <a href="#">bread</a>
        </div>
    </div>

</body>
</html>

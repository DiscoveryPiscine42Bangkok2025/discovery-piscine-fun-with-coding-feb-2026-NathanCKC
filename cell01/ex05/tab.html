<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;   
            border-collapse: collapse;
            border: 1px solid black;
            font-family: sans-serif;
        }

        td {
            width: 50%;
            height: 150px;
            padding: 15px;
            vertical-align: middle;
            border: 1px solid black;
        }

        .box-one {
            background-color: #c4d685; 
        }

        .box-two {
            background-color: #f7c6b7;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box-one">
                First cell
            </td>

            <td class="box-two">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>

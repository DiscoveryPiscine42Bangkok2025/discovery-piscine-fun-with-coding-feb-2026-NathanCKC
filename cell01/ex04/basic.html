<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shop-container {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .shop-item {
            display: inline-block;
            margin: 0 30px;
        }

        img {
            width: 200px;
            height: auto;
            border: 2px solid white;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: black;
            width: 100%;
        }

        .footer {
            text-align: right;
            
            font-style: italic;
            
            font-family: monospace;
            
            padding-right: 10px;
        }
    </style>
</head>
<body>

    <h1>-so bigger-</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
            <br>
            <a href="https://www.amazon.com" target="_blank">Visit Amazon</a>
        </div>

        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay Logo">
            <br>
            <a href="https://www.ebay.com" target="_blank">Visit eBay</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; nchaengk 2026
    </div>

</body>
</html>
